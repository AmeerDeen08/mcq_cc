<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSA Stack/Queue/LL MCQ Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>DSA MCQ Practice</h1>
      <div class="stats">
        <span id="topic-name">Topic</span>
        <span>Q: <span id="q-index">0</span>/<span id="q-total">0</span></span>
        <span>Score: <span id="score">0</span>/<span id="attempted">0</span></span>
      </div>
    </header>
    <div class="main">
      <aside class="topics">
        <h3>Topics</h3>
        <ul id="topic-list"></ul>
      </aside>
      <section class="quiz">
        <div class="question" id="question"></div>
        <div class="options" id="options"></div>
        <div class="actions">
          <button id="prev">Prev</button>
          <button id="next">Next</button>
          <button id="reset">Reset Topic</button>
          <button id="show-ans">Show Answer</button>
        </div>
        <div id="feedback"></div>
      </section>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
